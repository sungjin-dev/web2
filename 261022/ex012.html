<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이지스퍼블리싱</title>
    <style>
        .sqbullet {
            list-style-type: square;
            list-style-position: inside;
            /* list-style: square, inside; */
        }
        .nobullet {
            list-style-type: none;
        }

        ul {
            list-style-image: url('images/red_fix-removebg-preview.png');
            margin-top: 5px; 
        }

        li {
            padding: 5px;
            vertical-align: middle;
        }

    </style>
</head>
<body>
    <h1>이지스퍼블리싱</h1>
    <ul class="sqbullet">
        <li>회사소개</li>
        <li>도서</li>
        <li>자료실</li>
        <li>질문답변</li>
        <li>동영상강의</li>
    </ul>
    <ul class="nobullet">
        <li>회사소개</li>
        <li>도서</li>
        <li>자료실</li>
        <li>질문답변</li>
        <li>동영상강의</li>
    </ul>
</body>
</html>
