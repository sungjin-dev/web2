<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹 폼</title>
    <style>
        .subm {
            display: block;
            background-color: #fff;
            border: 1px solid #dedede;
            cursor: pointer;
            padding:5px 10px 6px 7px;
        }
        .subm img{
            border:0; /* 테두리가 없음 */
            padding:0;
            width:16px;
            height: 16px;
        }
        .subm:hover{
            background-color:greenyellow;
            border: 1px solid #c6d880;
            color: darkgreen;
        }
    </style>
</head>
<body>
    <form>
        <button type="submit" class="subm">
            <img src="images/check.jpg" alt="check">전송하기
            <!-- png(배경이 투명) jpg -->
        </button>
    </form>
</body>
</html>
