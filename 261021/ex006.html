<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹 폼</title>
    <style>
        form fieldset {
            margin: 10px 0;
        }
        form legend {
            font-size: 18px;
            color:cornflowerblue;
            font-weight: 600;
        }
        form label.reg {
            font-size: 14px;
            width: 120px;
            float: left;
        }
        form label em{
            font-size: 15px;
            color: red;
            font-weight: 800;
        }

        form ul li {
            list-style: none;
            margin: 10px;
        }
        form .easys {
            text-align: left;
            font-size: 12px;
            color: blue;
        }
        form fieldset.sendform {
            text-align: center;
        }

        #reg_container {
            display: flex;
        }

    </style>
</head>
<body>
    <form>
        <fieldset class="login">
            <legend></legend>
            <label for="user_id"></label>
            <input type="text" id="user_id" size="10" autofocus>
            <label for="user_pw">비밀번호</label>
            <input type="password" id="user_pw" size="10">
            <input type="submit" value="로그인">
        </fieldset>
        <fieldset class="register">
            <legend>가입하기</legend>
            <div id="reg_container">
                <div class="reg_content">
                    <ul>
                        <li>
                            <label class="reg" for="new_id">아이디 <em style="color:blue">*</em></label>
                            <input type="text" id="new_id" size="20" autocomplete="on" required>
                        </li>
                        <li>
                            <label class="reg" for="new_pw1">비밀번호 <em>*</em></label>
                            <input type="text" id="new_pw1" size="20" required>
                        </li>
                        <li>
                            <label class="reg" for="new_pw2">비밀번호 확인 <em>*</em></label>
                            <input type="text" id="new_pw2" size="20" required>
                        </li>
                        <li>
                            <label class="reg" for="user_name">이름 <em>*</em></label>
                            <input type="text" id="user_name" size="20" required>
                        </li>
                        <li>
                            <label class="reg" for="user_mail">메일 주소 <em>*</em></label>
                            <input type="text" id="user_mail" size="20" required>
                        </li>
                        <li>
                            <label class="reg" for="user_tel">전화번호 </label>
                            <input type="text" id="user_tel" size="20">
                        </li>
                    </ul>
                </div>
                <div class="reg_img">
                    <img src="images/human.jpg" alt="character">
                </div>
            </div>
            
        </fieldset>
        <fieldset class="easys">
            <legend>이지스퍼블리싱</legend>
            <textarea name="intro" cols="60" rows="5">
                Lorem ipsum dolor sit, amet consectetur adipisicing elit. Itaque enim incidunt quia at laborum nam, in magni ullam officiis illo rerum numquam porro earum quo reiciendis reprehenderit repudiandae laboriosam assumenda!
            </textarea>
        </fieldset>
        <fieldset class="sendform">
            <input type="submit" value="가입하기">
            <input type="reset" value="다시쓰기">
        </fieldset>
    </form>
</body>
</html>
