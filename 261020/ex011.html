<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹 폼</title>
    <style>
        ul {
            list-style: none;
        }

        h1 {
            margin-left: 25px;
        }

        li {
            margin: 10px;
        }

        p {
            color:brown;
            padding-left: 70px;
        }

        li label {
            width: 120px;
            float:left;
            text-align: right;
            padding-right: 8px;
        }

        input[type="url"] {
            width: 45%;
            height: 40px;
        }

        .report_container {
            display: flex;
            gap: 20px;
        }

        .login_container {
            display: flex;
            gap: 20px;
        }

        input[type="submit"] {
            text-align: center;
            width: 20%;
            height: 40px;
            margin-top: 15px;
            font-size: 1.1em;
            padding:5px;
            background-color:darkgreen;
            color: aliceblue;
        }

        .submit_button {
            text-align: center;
        }

        fieldset {
            background-color:beige;
            margin: 25px;
        }

        legend {
            border: 1px solid;
            background-color:khaki;
            border-radius: 5%;
        }

        a {
            margin-left: 70px;
        }

        .img_cat2 {
            border-radius: 50%;
        }

        figcaption {
            text-align: center;
            padding-left: 55px;
        }

    </style>
</head>
<body>
    <div>
        <img src="images/yellow.jpg"  width="10000" height="100" alt="노란색">
    </div>

    <h1>회원 가입</h1>
    <form>
        <fieldset>
            <legend>로그인 정보</legend>
            <div class="login_container">
                <div class="login_inf">
                    <ul>
                        <li>
                            <label for="user-id">아이디</label>
                            <input type="text" id="user-id">    
                        </li>
                        <li>
                            <label for="pwd1">비밀번호</label>
                            <input type="password" id="pwd1">
                        </li>
                        <li>
                            <label for="pwd2">비밀번호</label>
                            <input type="password" id="pwd2">
                        </li>
                    </ul>
                </div>
                 <div>
                    <ul>
                        <li>
                            <p>비밀번호는 반드시 특수문자를 넣어주세요!</p>
                            <p>예시: @#$%^&* 등</p>
                        </li>
                    </ul>
                </div>
                <div>
                    <figure>
                        <a><img class="img_cat2" src="images/cat1.jpg" width="150" height="150" alt="고양이2"></a>
                    </figure>
                    <figcaption>
                        야옹 야옹 야옹이다옹!
                    </figcaption>
                </div>
            </div>
        </fieldset>
        <fieldset>
            <legend>개인 정보</legend>
            <ul>
                <li>
                    <label for="user-name">이름</label>
                    <input type="text" id="user-name">    
                </li>
                <li>
                    <label for="mail">메일 주소</label>
                    <input type="email" id="mail">
                    <p><em>반드시 @형태로 입력해주세요!</em></p>
                </li>
                <li>
                    <label for="phone">연락처</label>
                    <input type="tel" id="phone">
                    <p><em>'-'를 제외하고 숫자만 넣어주세요!</em></p>
                </li>
                <li>
                    <label for="homep">블로그/홈페이지</label>
                    <input type="url" id="homep">
                </li>
            </ul>
        </fieldset>
        <div class="submit_button">
            <input type="submit" value="가입하기">
        </div>
        <fieldset>
            <legend>귀여운 고양이</legend>
            <div class="report_container">
                <div class="cat">
                    <img src="images/cat.jpg" width="300" height="300"  alt="고양이">
                </div>
                <div>
                    <h2>고양이</h2>
                    <ul>
                        <li>저는 고양이 입니다</li>
                        <li>츄르를 좋아합니다</li>
                        <li>저는 위아래가 없습니다 집사도 제 장난감이예요</li>
                    </ul>
                </div>
            </div>
        </fieldset>    
    </form>
</body>
</html>
