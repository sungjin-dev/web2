<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>이미지 삽입하기</title>
</head>
<body>
    <h1>제품 선택</h1>
    <figure>
        <figcaption><strong>언덕 위 홀로 서있는 나무(isolated tree)</strong></figcaption>
        <br>
        <img src="images/tree1.jpg" alt="언덕 위 홀로 서있는 나무">
        <img src="images/tree2.jpg" width="300" height="300" alt="동트기 전 홀로 서있는 나무">
        <img src="images/tree3.jpg" width="300" height="300" alt="몽환적인 분위기로 홀로 서있는 나무">
        <img src="images/tree4.jpg" width="300" height="300" alt="황야에 홀로 서있는 나무">
    </figure>
    <figure>
        <figcaption><strong>동트기 전 홀로 서있는 나무(isolated tree2)</strong></figcaption>
        <br>
        <img src="images/tree2.jpg" width="300" height="300" alt="동트기 전 홀로 서있는 나무">
    </figure>
    <figure>
        <figcaption><strong>몽환적인 분위기로 홀로 서있는 나무(isolated tree2)</strong></figcaption>
        <br>
        <img src="images/tree3.jpg" width="300" height="300" alt="몽환적인 분위기로 홀로 서있는 나무">
    </figure>
   
</body>
</html>
