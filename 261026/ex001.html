<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div#wrapper {
            position: relative;
        }
        .box {
            position:absolute;
            width: 100px;
            height: 100px;
            border: 1px solid black;
            font-size: 26px;
        }
        #b1 {
            left: 50px;
            top:50px;
            background: red;
            z-index: 1;
        }
        #b2 {
            left: 110px;
            top:70px;
            background: yellow;
            z-index: 3;
        }
        #b3 {
            left: 70px;
            top:110px;
            background: #0094ff;
            z-index: 5;
        }

    </style>
</head>
<body>
    <body>
        <div id="wrapper">
            <div id="b1" class="box"></div>
            <div id="b2" class="box"></div>
            <div id="b3" class="box"></div>
        </div>
    </body>
</body>
</html>
