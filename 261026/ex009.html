<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <!-- <link href="css/style.css" rel="sytlesheet" type="text/css"> -->
     <style>
        body {
    font: 14px 맑은 고딕;
}

.container {
    position: absolute;
    width: 960px;
    margin: 0 auto;
    background-color: #fff;
    border: 1px solid #e7e7e7;
}

header {
    position: relative;
    height: 280px;
    background-image: url('/images/cafe.jpg');
    background-repeat: no-repeat;
    background-position: left top;
}

header h1 {
    position: absolute;
    right: 20px;
    bottom: 70px;
    font-size: 3em;
    color: #ffc;
    text-shadow: 1px 2px 2px #000;
}

header h2 {
    position: absolute;
    right: 20px;
    bottom: 30px;
    font-size: 2em;
    color:darkgreen;
    text-shadow: 0px 1px 1px #000
}

.navi ul {
    list-style: none;
    height: 40px;
    padding-top: 10px;
    padding-bottom: 5px;
}

.navi ul li {
    display: inline-block;
    font-size: 15px;
}

.navi a, .navi a:visited {
    padding: 10px 5px 5px 35px;
    display: block;
    color: #fff;
    width: 150px;
    text-decoration: none;
}

.navi a:hover, .navi a:active, .navi a:focus {
    text-shadow: 0px 2px 2px #000;
    color: #fc0;
}

header, section, footer, aside, article, figure {
    display: block;
}
     </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>공간태리</h1>
            <h2>가장 아름다운 카페 in 대전</h2>
        </header>
            <nav class="navi">
                <ul>
                    <li><a href="#">이용 안내</a></li>
                    <li><a href="#">메뉴 소개</a></li>
                    <li><a href="#">위치 안내</a></li>
                    <li><a href="#">전화번호 및 문의사항</a></li>
                </ul>
            </nav>
    </div>
</body>
</html>
