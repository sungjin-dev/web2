<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul {
            border: 1px solid #ccc;
        }

        li {
           display: inline-block;
        }

        a[href] {
            background: yellow;
        }

        a[target="_blank"] {
            padding: 30px;
            background: url(images/structure.jpg) no repeat center right;
        }

    </style>
</head>
<body>
    <ul>
            <li><a>메인 메뉴 :</a></li>
            <li><a href="#">메뉴1</a></li>
            <li><a href="#">메뉴2</a></li>
            <li><a href="#">메뉴3</a></li>
            <li><a href="#">메뉴4</a></li>
    </ul>

    <h1>HTML5 표준안 사이트</h1>
    <ul>
        <li><a href="http://naver.com" target="_blank">NAVER</a></li>
        <li><a href="http://naver.com">GOOGLE</a></li>
        <li><a href="http://naver.com">YAHOO</a></li>
    </ul>
</body>
</html>
