<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            width: 250px;
            height: 300px;
            margin: 20px;
            display: inline-block;
            border: 2px solid;
            border-radius: 50%/40%;
        }
        .bg1 {
            background: url(images/astronaut.jpg) no-repeat;
            background-size: cover;
        }
        .bg2 {
            background: url(images/astronaut.jpg) no-repeat;
            background-size: contain;
        }
        .bg3 {
            background: url(images/astronaut.jpg) no-repeat;
            background-size:auto;
        }

    </style>
</head>
<body>
    <div></div>
    <div class="bg1"></div>
    <div class="bg2"></div>
    <div class="bg3"></div>
</body>
</html>
