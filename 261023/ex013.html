<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            float: left;
            margin-right: 20px;
        }
        .box1 {
            box-sizing: content-box;  /* 컨텐츠 영역 기준 */
            width: 300px;   /* 콘텐츠 영역 너비 300px */
            height: 150px;
            margin:10px;
            padding: 30px;
            border: 2px solid red;
        }
        .box2 {
            box-sizing: border-box;  /* 테두리까지(박스 전체) 기준 */
            width: 300px;   /* 박스 모델 전체 너비 300px */
            height: 150px;
            margin:10px;
            padding: 30px;
            border: 2px solid red;
        }
    </style>
</head>
<body>
    <div class="box1">box-sizing = "content-box"</div>
    <div class="box2">box-sizing = "border-box"</div>
</body>
</html>
