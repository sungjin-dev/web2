<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #wrap {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 100px;
            border: 1px solid #ccc;
        }
        .box {
            position: absolute;
            width: 50px;
            height: 50px;
        }
        #crd1 {top:0; left:0; background-color: aqua;}
        #crd2 {top:0; right:0; background-color: bisque;}
        #crd3 {bottom:0; left:0; background-color: brown;}
        #crd4 {bottom:0; right:0; background-color: chartreuse;}
        #crd5 {top: 300px; left: 300px; background-color: chocolate;}
        #crd6 {top: 200px; left: 200px; background-color: chocolate;}
        #crd7 {top: -50px; left: -50px; background-color: chocolate;}
        #crd8 {bottom: 50px; right: 50px; background-color: chartreuse;} /*  해당 코드만 움직이는 단축키 alt 화살표 */
    </style>
</head>
<body>
    <div id="wrap">
        <div class="box" id="crd1"></div>
        <div class="box" id="crd2"></div>
        <div class="box" id="crd3"></div>
        <div class="box" id="crd4"></div>
        <div class="box" id="crd5"></div>
        <div class="box" id="crd6"></div>
        <div class="box" id="crd7"></div>
        <div class="box" id="crd8"></div>
    </div>
</body>
</html>
