<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #container {
            width: 500px;
            height: 300px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap-reverse;
            border: 2px solid black;
        }
        #container div {
            width: 200px;
            border: 2px solid black;
            background: #ccc;
        }
        h2 {
            font-size: 20px;
            font-weight: bold;
            padding: 20px;
        }
        #box1 {
            order:2;
            flex:1 1 0;
        }
        #box2 {
            order:3;
            flex:2 2 0;
        }
        #box3 {
            order:1;
            flex:1 1 0;
        }
        
    </style>
</head>
<body>
    <div id="container">
        <div id="box1"><h2>1</h2></div>
        <div id="box2"><h2>2</h2></div>
        <div id="box3"><h2>3</h2></div>
    </div>
</body>
</html>
