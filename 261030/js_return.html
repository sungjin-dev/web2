<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <style>
        *{
            margin: 0;
            padding: 0;
        }
        #galleryzone {text-align: center;}
        #galleryzone input[type="image"] {
            margin: 0 8px;
        }
    </style>
    <script>
        var num = 1;
        function gallery(direct) {
            if(direct) {
                if(num == 8) return;
                num++;
            } else {
                if(num == 1) return;
                num--;
            }
            var imgTag = document.getElementById("photo");
            imgTag.setAttribute("src", "images/math_img"+num+".jpg");
        }
    </script>
</head>
<body>
        <header>
            <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
             <div class="container-fluid">
                <a class="navbar-brand" href="#">Navbar</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDarkDropdown" aria-controls="navbarNavDarkDropdown" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNavDarkDropdown">
                    <ul class="navbar-nav">
                    <li class="nav-item dropdown">
                        <button class="btn btn-dark dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                        Dropdown
                        </button>
                        <ul class="dropdown-menu dropdown-menu-dark">
                        <li><a class="dropdown-item" href="#">Action</a></li>
                        <li><a class="dropdown-item" href="#">Another action</a></li>
                        <li><a class="dropdown-item" href="#">Something else here</a></li>
                        </ul>
                    </li>
                    </ul>
                </div>
                </div>
            </nav>
        </header>
        

        <div id="galleryZoon">
        <p>
            <img src="images/math_img_1.jpg" id="photo" alt="" class="border border-warning border-5">
        </p>
        <button type="button" class="btn btn-primary" onclick="gallery(0)">이전</button>
        <button type="button" class="btn btn-warning" onclick="gallery(1)">다음</button>


</button>
</div>
</body>
</html>
