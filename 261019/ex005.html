<!DOCTYPE html>
<html lang="en">
<head>

        }

            padding: 75px;

        }

        <tr>

        <tr>

        </tr>
    </table>

    <br><br>

    <table>

            <td>1행 1열</td>
            <td>1행 2열</td>
        </tr>

        </tr>
        <tr>
            <td>3행 1열</td>

        </tr>

</html>
